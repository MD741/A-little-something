<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A Little Something</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #a9a0c9, #7f96bd);
      animation: bgShift 16s ease-in-out infinite alternate;
      overflow-x: hidden;
      color: #2e2e2e;
    }

    @keyframes bgShift {
      from { filter: brightness(0.9); }
      to { filter: brightness(0.82); }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.05);
    }

    /* ---------- SCREEN 1 ---------- */

    #screen1 {
      justify-content: center;
      text-align: center;
    }

    .intro-title {
      font-size: 3.2rem;
      font-weight: 800;
      text-transform: uppercase;
      animation: floatText 3s ease-in-out infinite;
    }

    .intro-sub {
      margin-top: 14px;
      font-size: 1.1rem;
      opacity: 0.75;
      text-transform: uppercase;
    }

    .intro-btn {
      margin-top: 50px;
      padding: 18px 52px;
      border-radius: 50px;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      background: linear-gradient(135deg, #6f8cff, #9f7aea);
      color: white;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .intro-btn:hover {
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    }

    /* ---------- CONFETTI ---------- */

    .confetti {
      position: fixed;
      width: 8px;
      height: 14px;
      animation: confettiFall linear forwards;
      opacity: 0.9;
    }

    @keyframes confettiFall {
      from { transform: translateY(-10vh) rotate(0deg); }
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ---------- SCREEN 2 ---------- */

    #screen2 {
      justify-content: flex-start;
      text-align: center;
      overflow-y: auto;
      padding-top: 4.5cm;
      padding-bottom: 3rem;
    }

    .photo-wrapper {
      position: relative;
      margin-bottom: 32px;
    }

    /* Neon particle container */
    .particle-layer {
      position: absolute;
      inset: -120px;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe6ff, #ff9de2, transparent);
      box-shadow: 0 0 14px #ffb6f2, 0 0 30px #ffffff;
      animation: shoot 1.8s ease-out forwards;
    }

    /* Radius = 8cm → Diameter = 16cm */
    .photo-glow {
      width: 8cm;
      height: 8cm;
      border-radius: 50%;
      padding: 0.7cm;
      background: linear-gradient(
        135deg,
        rgba(255,182,193,0.95),
        rgba(255,255,255,0.95)
      );
      box-shadow:
        0 0 60px rgba(255,182,193,0.9),
        0 0 130px rgba(255,255,255,0.75);
      animation: pulseGlow 2.8s ease-in-out infinite alternate;
      position: relative;
      z-index: 2;
      margin: 0 auto;
    }

    .photo-glow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
    }

    .birthday-title {
      font-size: 3.6rem;
      font-weight: 800;
      text-transform: uppercase;
      background: linear-gradient(90deg, #5f7cff, #b07cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .birthday-sub {
      margin-top: 14px;
      font-size: 1.3rem;
      font-weight: 500;
      color: #444;
      text-transform: uppercase;
    }

    .message-box {
      margin-top: 55px;
      padding: 40px 45px;
      max-width: 480px;
      border-radius: 26px;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
    }

    .message-box p {
      font-size: 1rem;
      line-height: 1.8;
      text-transform: uppercase;
      color: #2f2f2f;
    }

    .signature {
      margin-top: 28px;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 2px;
      opacity: 0.55;
      text-transform: uppercase;
    }

    /* ---------- ANIMATIONS ---------- */

    @keyframes shoot {
      from {
        transform: translate(0,0) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }

    @keyframes pulseGlow {
      from {
        box-shadow:
          0 0 45px rgba(255,182,193,0.7),
          0 0 90px rgba(255,255,255,0.5);
      }
      to {
        box-shadow:
          0 0 75px rgba(255,182,193,0.95),
          0 0 150px rgba(255,255,255,0.8);
      }
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px rgba(176,124,255,0.6); }
      to { text-shadow: 0 0 35px rgba(95,124,255,0.9); }
    }

    @keyframes floatText {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- SCREEN 1 -->
  <div class="screen" id="screen1">
    <div class="intro-title">A Little Something</div>
    <div class="intro-sub">Tap when you're ready</div>
    <button class="intro-btn" onclick="reveal()">Open 🎁</button>
  </div>

  <!-- SCREEN 2 -->
  <div class="screen hidden" id="screen2">

    <div class="photo-wrapper">
      <div class="particle-layer" id="particles"></div>

      <div class="photo-glow">
        <img src="assets/pahandi.jpg" alt="Pahandi">
      </div>
    </div>

    <div class="birthday-title">Happy Birthday, Pahandi 🎉</div>
    <div class="birthday-sub">Hope today feels extra nice 🌸</div>

    <div class="message-box">
      <p>
        Another year, another moment worth celebrating ✨<br><br>
        May this one bring good energy, big wins,
        and reasons to smile without trying too hard 🙂
      </p>
      <div class="signature">From Chethiya</div>
    </div>

  </div>

  <script>
    function reveal() {
      launchConfetti();
      setTimeout(() => {
        document.getElementById("screen1").classList.add("hidden");
        document.getElementById("screen2").classList.remove("hidden");
        startParticles();
      }, 700);
    }

    function launchConfetti() {
      const colors = ["#ffb6c1", "#ffffff", "#9f7aea", "#6f8cff"];
      for (let i = 0; i < 120; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = 3 + Math.random() * 2 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
    }

    function startParticles() {
      const layer = document.getElementById("particles");
      const radius = 260; // pixels from center, outside frame

      setInterval(() => {
        const p = document.createElement("div");
        p.className = "particle";

        const angle = Math.random() * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        p.style.left = `calc(50% + ${x}px)`;
        p.style.top = `calc(50% + ${y}px)`;

        p.style.setProperty("--dx", `${Math.cos(angle) * 180}px`);
        p.style.setProperty("--dy", `${Math.sin(angle) * 180}px`);

        layer.appendChild(p);
        setTimeout(() => p.remove(), 2000);
      }, 120);
    }
  </script>

</body>
</html>
