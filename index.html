<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A Little Something</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
    html, body { width:100%; height:100%; overflow:hidden; background:linear-gradient(135deg,#a9a0c9,#7f96bd); position:relative;}
    .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .8s ease, transform .8s ease; z-index:2; }
    .hidden { opacity:0; pointer-events:none; transform:scale(1.05); }

    .intro-title { font-size:3.2rem; font-weight:800; text-transform:uppercase; animation: floatText 3s ease-in-out infinite;}
    .intro-sub { margin-top:14px; font-size:1.1rem; opacity:0.75; text-transform:uppercase; }
    .intro-btn { margin-top:50px; padding:18px 52px; border-radius:50px; border:none; font-size:1.1rem; cursor:pointer; background:linear-gradient(135deg,#6f8cff,#9f7aea); color:white; box-shadow:0 20px 50px rgba(0,0,0,0.25); transition: transform .3s ease, box-shadow .3s ease;}
    .intro-btn:hover { transform: translateY(-6px) scale(1.08); box-shadow:0 30px 70px rgba(0,0,0,0.35); }

    #screen2 { text-align:center; padding:5rem 2rem 3rem; color:#fff; z-index:2; position:relative;}
    .birthday-title { font-size:3.6rem; font-weight:800; text-transform:uppercase; }
    .birthday-title span { font-size:2.2rem; color:#e91e63; } /* Darker pink */
    .birthday-sub { margin-top:14px; font-size:1.3rem; font-weight:500; text-transform:uppercase; }
    .message-box { margin-top:50px; padding:40px 45px; max-width:480px; border-radius:26px; background:rgba(255,255,255,0.35); backdrop-filter:blur(14px); box-shadow:0 25px 60px rgba(0,0,0,0.2); color:#2f2f2f; }
    .message-box p { font-size:1rem; line-height:1.8; text-transform:uppercase; }

    canvas { position:absolute; top:0; left:0; pointer-events:none; z-index:1; }
    @keyframes floatText { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  </style>
</head>
<body>

  <!-- Screens -->
  <div class="screen" id="screen1">
    <div class="intro-title">A Little Something</div>
    <div class="intro-sub">Tap when you're ready</div>
    <button class="intro-btn" onclick="reveal()">Open 🎁</button>
  </div>

  <div class="screen hidden" id="screen2">
    <div class="birthday-title">Happy Birthday, <span>Pahandi</span> 🎉</div>
    <div class="birthday-sub">Hope today feels extra nice 🌸</div>
    <div class="message-box">
      <p>
        Another year, another moment worth celebrating ✨<br><br>
        May this one bring good energy, big wins,
        and reasons to smile without trying too hard 🙂
      </p>
    </div>
  </div>

  <!-- Canvases -->
  <canvas id="confettiCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <script>
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    const particleCanvas = document.getElementById('particleCanvas');
    const particleCtx = particleCanvas.getContext('2d');

// Set canvas size immediately
confettiCanvas.width = window.innerWidth;
confettiCanvas.height = window.innerHeight;
particleCanvas.width = window.innerWidth;
particleCanvas.height = window.innerHeight;
    let confettiPieces = [];
    let particles = [];
    let confettiActive = false;

    function random(min,max){ return Math.random()*(max-min)+min; }

    class Confetti {
      constructor(){
        this.x = random(0, confettiCanvas.width);
        this.y = random(-confettiCanvas.height, 0);
        this.size = random(5,12);
        this.color = `hsl(${random(0,360)},80%,60%)`;
        this.tilt = random(-15,15);
        this.tiltAngleIncrement = random(0.05,0.12);
        this.tiltAngle = 0;
        this.gravity = random(0.3,0.6);
        this.speedY = random(2,5);
      }
      update(){
        this.tiltAngle += this.tiltAngleIncrement;
        this.y += this.speedY + this.gravity;
        this.x += Math.sin(this.tiltAngle);
        this.tilt = Math.sin(this.tiltAngle) * 15;
      }
      draw(ctx){
        ctx.beginPath();
        ctx.lineWidth = this.size/2;
        ctx.strokeStyle = this.color;
        ctx.moveTo(this.x + this.tilt + this.size/2, this.y);
        ctx.lineTo(this.x + this.tilt, this.y + this.tilt + this.size/2);
        ctx.stroke();
      }
    }

    class Particle {
      constructor(){
        this.x = random(0, particleCanvas.width);
        this.y = random(0, particleCanvas.height);
        this.radius = random(1,4);
        this.alpha = random(0.3,0.8);
        this.speedX = random(-0.5,0.5);
        this.speedY = random(-0.3,0.3);
      }
      update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x<0) this.x = particleCanvas.width;
        if(this.x>particleCanvas.width) this.x = 0;
        if(this.y<0) this.y = particleCanvas.height;
        if(this.y>particleCanvas.height) this.y = 0;
      }
      draw(ctx){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
        ctx.fill();
      }
    }

    function createConfetti(count){
      confettiPieces = [];
      for(let i=0;i<count;i++) confettiPieces.push(new Confetti());
    }

    function createParticles(count){
      particles = [];
      for(let i=0;i<count;i++) particles.push(new Particle());
    }

    function updateConfetti(){
      confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      confettiPieces.forEach(p=>{
        p.update();
        p.draw(confettiCtx);
      });
      if(confettiActive) requestAnimationFrame(updateConfetti);
    }

    function updateParticles(){
      particleCtx.clearRect(0,0,particleCanvas.width,particleCanvas.height);
      particles.forEach(p=>{
        p.update();
        p.draw(particleCtx);
      });
      requestAnimationFrame(updateParticles);
    }

    function reveal(){
      document.getElementById("screen1").classList.add("hidden");
      document.getElementById("screen2").classList.remove("hidden");

      confettiActive = true;
      createConfetti(300); // spawn across entire canvas
      createParticles(150);

      updateConfetti();
      updateParticles();

      // Stop confetti after 5 seconds
      setTimeout(()=>{ confettiActive = false; }, 5000);
    }

    window.addEventListener('resize',()=>{
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      particleCanvas.width = window.innerWidth;
      particleCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
